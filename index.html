<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3.5 20 12l8.5 1-6.25 6 1.75 8.75L16 23l-8 4.75L9.75 19 3.5 13l8.5-1 4-8.5Z" />
          </svg>
        </div>

        <div class="heading">
          <p class="eyebrow">WELCOME BACK</p>
          <h1 id="login-title">Sign in to your account</h1>
          <p>Enter your details below to continue.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12a2.25 2.25 0 0 1 2.25 2.25v10.5A2.25 2.25 0 0 1 18 19.5H6a2.25 2.25 0 0 1-2.25-2.25V6.75Z" />
                <path d="m4.5 6 6.22 4.66a2.15 2.15 0 0 0 2.56 0L19.5 6" />
              </svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="field-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#forgot-password" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4.5" y="10" width="15" height="10" rx="2" />
                <path d="M8 10V7.5a4 4 0 0 1 8 0V10" />
              </svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6" />
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.75 12s3.35-5.5 9.25-5.5S21.25 12 21.25 12s-3.35 5.5-9.25 5.5S2.75 12 2.75 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3 21 21" />
                  <path d="M10.58 6.68A10.43 10.43 0 0 1 12 6.5c5.9 0 9.25 5.5 9.25 5.5a16.28 16.28 0 0 1-3.03 3.69M6.1 6.1C3.9 7.7 2.75 12 2.75 12s3.35 5.5 9.25 5.5a9.3 9.3 0 0 0 2.02-.22" />
                  <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24" />
                </svg>
              </button>
            </div>
          </div>

          <label class="remember-me">
            <input type="checkbox" name="remember" />
            <span class="checkmark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3.25 8.25 3 3 6.5-6.5" /></svg></span>
            <span>Remember me for 30 days</span>
          </label>

          <p id="form-message" class="form-message" aria-live="polite"></p>
          <button class="submit-button" type="submit">Sign in <span aria-hidden="true">&rarr;</span></button>
        </form>

        <p class="signup-prompt">New here? <a href="#create-account">Create an account</a></p>
      </section>

    </main>

    <script src="script.js"></script>
  </body>
</html>
